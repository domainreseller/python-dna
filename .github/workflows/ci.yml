name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # ubuntu-latest no longer ships 3.9. macOS runs only in the
        # domainreseller repository: forks get no macOS runner, so the job sat
        # queued for 15 minutes, was cancelled and turned the whole run red.
        include: ${{ fromJSON(github.repository_owner == 'domainreseller'
          && '[{"os":"ubuntu-22.04","python-version":"3.9"},{"os":"windows-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.12"}]'
          || '[{"os":"ubuntu-22.04","python-version":"3.9"},{"os":"windows-latest","python-version":"3.12"}]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite (unit, OpenAPI spec, examples; no network)
        run: python -m unittest discover -s tests -v

      - name: Build sdist and wheel
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade build
          python -m build
